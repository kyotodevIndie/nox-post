# Rota pública no caddy-docker-proxy da VPS. Só entra quando NOX_POST_DOMAIN está no stack.env (e o DNS já aponta).
# Upload de vídeo pode passar de 100 MB: o Caddy não limita corpo por padrão.
services:
  api:
    labels:
      caddy: ${NOX_POST_DOMAIN:?}
      caddy.reverse_proxy: "{{upstreams 3500}}"
